<form class="layui-form layui-card" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off">

    <div class="layui-card-body padding-left-40">

        <div class="layui-form-item">
            <label class="relative block">
                <span class="color-green font-w7">{:lang('权限名称')}</span>
                <span class="color-desc margin-left-5">Title</span>
                <input type="text" name="title" value='{$vo.title|default=""}' required placeholder="{:lang('请输入权限名称')}" class="layui-input">
            </label>
        </div>

        <div class="layui-form-item">
            <label class="relative block">
                <span class="color-green font-w7">{:lang('权限描述')}</span>
                <span class="color-desc margin-left-5">Authorization</span>
                <textarea placeholder="{:lang('请输入权限描述')}" required class="layui-textarea" name="desc">{$vo.desc|default=""}</textarea>
            </label>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    {notempty name='vo.id'}<input type='hidden' value='{$vo.id}' name='id'>{/notempty}

    <div class="layui-form-item text-center">
        <button class="layui-btn" type='submit'>{:lang('保存数据')}</button>
        <button class="layui-btn layui-btn-danger" type='button' data-confirm="{:lang('确定要取消编辑吗？')}" data-close>{:lang('取消编辑')}</button>
    </div>
</form>
