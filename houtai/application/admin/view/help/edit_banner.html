<form onsubmit="return false;" id="GoodsForm" data-auto="true" method="post" class='layui-form layui-card' autocomplete="off">

    <div class="layui-card-body think-box-shadow padding-left-40">

        <div class="layui-form-item layui-row layui-col-space15">

            <label class="layui-col-xs9 relative">
                <span class="color-green">{:lang('跳转链接')}</span>
                <input name="url" required class="layui-input" placeholder="{:lang('请输入跳转链接')}" value="{$info.url}">
                <input type="hidden" name="id" value="{$info.id}">
                <input type="hidden" name="_csrf_" value="{:systoken('edit_banner')}">
            </label>
        </div>



        <div class="layui-form-item block">
            <span class="label-required-prev color-green">{:lang('图片')}</span>

            <p width="auto" class="text-left"><input name="image" type="hidden" value="{$info.image|default=''}"></p>
            <script> $('[name="image"]').uploadMultipleImage()</script>
            <p>{:lang(' 图片只能保存一张,更换请先删除')}</p>
        </div>

        <div class="layui-form-item text-center">
            <button class="layui-btn" type="submit">{:lang('提交')}</button>
            <button class="layui-btn layui-btn-danger" ng-click="hsitoryBack()" type="button">{:lang('取消')}</button>
        </div>

    </div>
</form>


{/block}
