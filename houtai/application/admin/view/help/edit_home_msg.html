{extend name='admin@main'}

{block name="content"}


<form onsubmit="return false;" id="GoodsForm" data-auto="true" method="post" class='layui-form layui-card' autocomplete="off">

    <div class="layui-card-body think-box-shadow padding-left-40">

        <div class="layui-form-item layui-row layui-col-space15">

             <label class="layui-col-xs9 relative">
                <span class="color-green">{:lang('正文')}</span>
                 <input name="title" class="layui-input" value="{$info.title}"  placeholder="{:lang('请输入标题')}">
            </label>
            <input type="hidden" name="id" value="{$info.id}">

            <!-- 英语 English - en_es -->
            <label class="layui-col-xs9 relative">
                <span class="color-green">{:lang('标题英语')}</span>
                <input name="t_en_es" class="layui-input" value="{$info.t_en_es}"  placeholder="{:lang('请输入标题')}">
            </label>
            <!-- 法语 French - tw_tw -->
            <label class="layui-col-xs9 relative">
                <span class="color-green">{:lang('标题法语')}</span>
                <input name="t_tw_tw" class="layui-input" value="{$info.t_tw_tw}"  placeholder="{:lang('请输入标题')}">
            </label>
            <!-- 德语 German - hy_hy -->
            <label class="layui-col-xs9 relative">
                <span class="color-green">{:lang('标题德语')}</span>
                <input name="t_hy_hy" class="layui-input" value="{$info.t_hy_hy}"  placeholder="{:lang('请输入标题')}">
            </label>
            <!-- 西班牙语 Spanish - es_mx -->
            <label class="layui-col-xs9 relative">
                <span class="color-green">{:lang('标题西班牙语')}</span>
                <input name="t_es_mx" class="layui-input" value="{$info.t_es_mx}"  placeholder="{:lang('请输入标题')}">
            </label>
            <!-- 葡萄牙语 Portuguese - pt_br -->
            <label class="layui-col-xs9 relative">
                <span class="color-green">{:lang('标题葡萄牙语')}</span>
                <input name="t_pt_br" class="layui-input" value="{$info.t_pt_br}"  placeholder="{:lang('请输入标题')}">
            </label>
            <!-- 意大利语 Italian - rus_rus -->
            <label class="layui-col-xs9 relative">
                <span class="color-green">{:lang('标题意大利语')}</span>
                <input name="t_rus_rus" class="layui-input" value="{$info.t_rus_rus}"  placeholder="{:lang('请输入标题')}">
            </label>
        </div>

        <!-- 公告内容（英语） English - en_es -->
        <div class="layui-form-item block">
            <span class="label-required-prev color-green">{:lang('公告内容（英语）')}</span>
            <textarea name="en_es">{$info['en_es']}</textarea>
        </div>
        <!-- 公告内容（法语） French - tw_tw -->
        <div class="layui-form-item block">
            <span class="label-required-prev color-green">{:lang('公告内容（法语）')}</span>
            <textarea name="tw_tw">{$info['tw_tw']}</textarea>
        </div>
        <!-- 公告内容（德语） German - hy_hy -->
        <div class="layui-form-item block">
            <span class="label-required-prev color-green">{:lang('公告内容（德语）')}</span>
            <textarea name="hy_hy">{$info['hy_hy']}</textarea>
        </div>
        <!-- 公告内容（西班牙语） Spanish - es_mx -->
        <div class="layui-form-item block">
            <span class="label-required-prev color-green">{:lang('公告内容（西班牙语）')}</span>
            <textarea name="es_mx">{$info['es_mx']}</textarea>
        </div>
        <!-- 公告内容（葡萄牙语） Portuguese - pt_br -->
        <div class="layui-form-item block">
            <span class="label-required-prev color-green">{:lang('公告内容（葡萄牙语）')}</span>
            <textarea name="pt_br">{$info['pt_br']}</textarea>
        </div>
        <!-- 公告内容（意大利语） Italian - rus_rus -->
        <div class="layui-form-item block">
            <span class="label-required-prev color-green">{:lang('公告内容（意大利语）')}</span>
            <textarea name="rus_rus">{$info['rus_rus']}</textarea>
        </div>

        <div class="layui-form-item text-center">
            <button class="layui-btn" type="submit">{:lang('确认编辑')}</button>
            <button class="layui-btn layui-btn-danger" ng-click="hsitoryBack()" type="button">{:lang('取消编辑')}</button>
        </div>

    </div>
</form>
{/block}

{block name='script'}

<script>
    window.form.render();
    require(['ckeditor', 'angular'], function () {
        window.createEditor('[name="en_es"]', {height: 500});   // 英语 English
        window.createEditor('[name="tw_tw"]', {height: 500});   // 法语 French
        window.createEditor('[name="hy_hy"]', {height: 500});   // 德语 German
        window.createEditor('[name="es_mx"]', {height: 500});   // 西班牙语 Spanish
        window.createEditor('[name="pt_br"]', {height: 500});   // 葡萄牙语 Portuguese
        window.createEditor('[name="rus_rus"]', {height: 500}); // 意大利语 Italian

        var app = angular.module("GoodsForm", []).run(callback);
        angular.bootstrap(document.getElementById(app.name), [app.name]);

        function callback($rootScope) {
            $rootScope.isAddMode = parseInt('{$isAddMode|default=0}');
            $rootScope.maps = JSON.parse(angular.element('#goods-value').val() || '[]') || {};
            $rootScope.specs = JSON.parse(angular.element('#goods-specs').val() || '[{"name":"默认分组","list":[{"name":"默认规格","check":true}]}]');
            // 批量设置数值
            $rootScope.batchSet = function (type, fixed) {
                layer.prompt({title: '请输入数值', formType: 0}, function (value, index) {
                    $rootScope.$apply(function () {
                        var val = (parseFloat(value) || 0).toFixed(fixed);
                        for (var i in $rootScope.specsTreeData) for (var j in $rootScope.specsTreeData[i]) {
                            $rootScope.specsTreeData[i][j][type] = val;
                        }
                    });
                    layer.close(index);
                });
            };
            // 返回商品列表
            $rootScope.hsitoryBack = function () {
                $.msg.confirm('确定要取消编辑吗？', function (index) {
                    history.back(), $.msg.close(index);
                });
            };
            // 设置默认值
            $rootScope.setValue = function (key, type, value, call) {
                $rootScope.maps[key] || ($rootScope.maps[key] = {});
                return $rootScope.maps[key][type] = eval(call.replace('_', "'" + value + "'"));
            };
            // 读取默认值
            $rootScope.getValue = function (key, callback) {
                if (typeof callback === 'function') {
                    return callback($rootScope.maps[key] || {});
                }
                return {};
            };
            // 去除空白字符
            $rootScope.trimSpace = function (value) {
                return (value + '').replace(/\s*/ig, '');
            };
            // 生成交叉表格数据
            $rootScope.specsTreeData = [];
            $rootScope.specsTreeNava = [];
            // 当前商品规格发生变化时重新计算规格列表
            $rootScope.$watch('specs', function () {
                var data = $rootScope.specs, list = [], navs = [], table = [[]];
                // 过滤无效记录
                for (var i in data) {
                    var tmp = [];
                    for (var j in data[i].list) if (data[i].list[j].check && data[i].list[j].name.length > 0) {
                        data[i].list[j].span = 1, data[i].list[j].show = true, data[i].list[j].group = data[i].name;
                        tmp.push(data[i].list[j]);
                    }
                    list.push(tmp), navs.push(data[i].name);
                }
                $rootScope.specsTreeNava = navs;
                // 表格交叉
                for (var i in list) {
                    var tmp = [];
                    for (var j in table) for (var k in list[i]) tmp.push(table[j].concat(list[i][k]));
                    table = tmp;
                }
                // 表格合并
                list = angular.fromJson(angular.toJson(table));
                for (var i in list) {
                    var key = [], _key = '';
                    for (var td in list[i]) key.push(list[i][td].group + '::' + list[i][td].name);
                    for (var td in list[i]) if (_key.length === 0) {
                        list[i][0].key = _key = key.join(';;');
                        list[i][0].sku = $rootScope.getValue(_key, function (data) {
                            return data.sku || '0';
                        });
                        list[i][0].virtual = $rootScope.getValue(_key, function (data) {
                            return data.virtual || '0';
                        });
                        list[i][0].express = $rootScope.getValue(_key, function (data) {
                            return data.express || '1';
                        });
                        list[i][0].market = $rootScope.getValue(_key, function (data) {
                            return data.market || '0.00';
                        });
                        list[i][0].selling = $rootScope.getValue(_key, function (data) {
                            return data.selling || '0.00';
                        });
                        list[i][0].status = $rootScope.getValue(_key, function (data) {
                            return !!(typeof data.status !== 'undefined' ? data.status : true);
                        });
                    }
                }
                $rootScope.specsTreeData = list;
            }, true);
            // 判断规则是否能取消选择
            $rootScope.checkListChecked = function (list, check) {
                for (var i in list) if (list[i].check) return check;
                return true;
            };
            // 增加整行规格分组
            $rootScope.addSpecRow = function (data) {
                data.push({name: '规格分组', list: [{name: '规格属性', check: true}]})
            };
            // 下移整行规格分组
            $rootScope.dnSpecRow = function (data, $index) {
                var tmp = [], cur = data[$index];
                if ($index > data.length - 2) return false;
                for (var i in data) {
                    (parseInt(i) !== parseInt($index)) && tmp.push(data[i]);
                    (parseInt(i) === parseInt($index) + 1) && tmp.push(cur);
                }
                return $rootScope.specs = tmp;
            };
            // 上移整行规格分组
            $rootScope.upSpecRow = function (data, $index) {
                var tmp = [], cur = data[$index];
                if ($index < 1) return false;
                for (var i in data) {
                    (parseInt(i) === parseInt($index) - 1) && tmp.push(cur);
                    (parseInt(i) !== parseInt($index)) && tmp.push(data[i]);
                }
                return $rootScope.specs = tmp;
            };
            // 移除整行规格分组
            $rootScope.delSpecRow = function (data, $index) {
                var tmp = [];
                for (var i in data) if (parseInt(i) !== parseInt($index)) tmp.push(data[i]);
                return $rootScope.specs = tmp;
            };
            // 增加分组的属性
            $rootScope.addSpecVal = function (list) {
                list.push({name: '规格属性', check: true});
            };
            // 移除分组的属性
            $rootScope.delSpecVal = function (data, $index) {
                var temp = [];
                for (var i in data) if (parseInt(i) !== parseInt($index)) temp.push(data[i]);
                return temp;
            };
        }
    })
</script>
{/block}
