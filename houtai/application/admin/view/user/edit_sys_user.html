<form class="layui-form layui-card" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off">
    <div class="layui-card-body padding-left-40">
        <div class="layui-form-item">
            <label class="layui-form-label label-required">{:lang('登录名')}</label>
            <div class="layui-input-block">
                <input type="text" autocomplete="off" autofocus name="username"
                       value='{$sys_user.username}' placeholder="{:lang('登录名')}"
                       class="layui-input">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">{:lang('密码')}</label>
            <div class="layui-input-block">
                <input type="text" autocomplete="off" autofocus name="password"
                       value='' placeholder="{:lang('不填则不修改')}"
                       class="layui-input">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">{:lang('所属角色')}</label>
            <div class="layui-input-block">
                <select name="authorize" class="layui-select">
                    <option value="">{:lang('请选择角色')}</option>
                    {foreach $authorizes as $v}
                    <option value="{$v.id}" {if($sys_user.authorize == $v.id)} selected {/if}>{$v.title}</option>
                    {/foreach}
                </select>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">{:lang('昵称')}</label>
            <div class="layui-input-block">
                <input type="text" autocomplete="off" autofocus name="nickname"
                       value='{$sys_user.nickname}' placeholder="{:lang('昵称')}"
                       class="layui-input">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">{:lang('联系手机')}</label>
            <div class="layui-input-block">
                <input type="text" autocomplete="off" autofocus name="phone"
                       value='{$sys_user.phone}' placeholder="{:lang('联系手机')}"
                       class="layui-input">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">{:lang('状态')}</label>
            <div class="layui-input-block">
                <select name="status" class="layui-select" id="selectList">
                    <option value="1" {if($sys_user.status == 1)} selected {/if}>{:lang('开放')}</option>
                    <option value="0" {if($sys_user.status == 0)} selected {/if}>{:lang('禁用')}</option>
                </select>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">{:lang('Google验证')}</label>
            <div class="layui-input-block">
                <select name="google_verify" class="layui-select" id="selectList">
                    <option value="1" {if($sys_user.google_verify != 0)} selected {/if}>{:lang('开启')}</option>
                    <option value="0" {if($sys_user.google_verify == 0)} selected {/if}>{:lang('关闭')}</option>
                </select>
            </div>
        </div>
    </div>
    <div class="hr-line-dashed"></div>
    <input type="hidden" name="id" value="{$sys_user.id}">
    <div class="layui-form-item text-center">
        <button class="layui-btn layui-btn-danger" type='button' data-confirm="{:lang('确定取消吗？')}" data-close>{:lang('取消')}</button>
        <button class="layui-btn" type='submit'>{:lang('修改')}</button>
    </div>
</form>
<script>window.form.render();</script>
