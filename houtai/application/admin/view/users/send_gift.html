<form class="layui-form layui-card" action="{:url('send_gift')}" data-auto="true" method="post" autocomplete="off">
    <div class="layui-form-item">
        <label class="layui-form-label">{:lang('用户ID')}</label>
        <div class="layui-input-block">
            <input type="text" name="uid" value="{$user.id}" readonly class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:lang('用户名')}</label>
        <div class="layui-input-block">
            <input type="text" value="{$user.username}" readonly class="layui-input">
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">{:lang('触发单数')}</label>
        <div class="layui-input-block">
            <input type="text" name="start_num" value="{$yizuo + 1}" class="layui-input">
            <span style="color:green;">{:lang('用户总单数：')}{$ordersetting} </span> <span style="color:red;"> {:lang('当前已做单数：')}{$yizuo}</span>
        </div>
        
    </div>
    
    <div class="layui-form-item">
            <label class="layui-form-label">{:lang('指定礼包')}：</label>
            <div class="layui-input-block">
                <input type="radio" name="selected_gift" value="1" title="{:lang('礼包1')}" checked lay-filter="genderRadio">
                <input type="radio" name="selected_gift" value="2" title="{:lang('礼包2')}" lay-filter="genderRadio">
                <input type="radio" name="selected_gift" value="3" title="{:lang('礼包3')}" lay-filter="genderRadio">
            </div>
    </div>

    <!-- 礼包1：金额福利 -->
    <fieldset class="layui-elem-field">
        <legend>{:lang('礼包1：金额福利')}</legend>
        
        <div class="layui-form-item">
            <label class="layui-form-label">{:lang('赠送金额')}</label>
            <div class="layui-input-block">
                <input type="number" name="gift1_amount" value="10" step="0.01" class="layui-input" placeholder="{:lang('请输入赠送金额')}">
            </div>
        </div>
    </fieldset>

    <!-- 礼包2：订单福利 -->
    <fieldset class="layui-elem-field">
        <legend>{:lang('礼包2：订单福利')}</legend>
        <div style="color:red;margin: 10px 30px;">订单金额小于用户余额直接赠送为金额福利，大于用户余额生成1个负数订单</div>
        <div class="layui-form-item">
            <label class="layui-form-label">{:lang('订单金额')}</label>
            <div class="layui-input-block">
                <input type="number" name="gift2_order_amount" value="{$user.balance + 100}" step="0.01" class="layui-input" placeholder="{:lang('请输入订单金额')}">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{:lang('预计负数约')}</label>
            <div class="layui-input-block">
                <input style="color:red;" type="text" value="" readonly class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{:lang('订单佣金(%)')}</label>
            <div class="layui-input-block">
                <input type="number" name="gift2_commission" value="1" step="0.01" class="layui-input" placeholder="{:lang('请输入佣金百分比')}">
            </div>
        </div>
    </fieldset>

    <!-- 礼包3：复合奖励 -->
    <fieldset class="layui-elem-field">
        <legend>{:lang('礼包3：复合奖励')}</legend>
        <div style="color:red;margin: 10px 30px;">总订单金额小于用户余额直接赠总订单金额福利，大于用户余额生成多个负数订单</div>
        <div class="layui-form-item">
            <label class="layui-form-label">{:lang('订单金额')}</label>
            <div class="layui-input-block">
                <input type="number" name="gift3_order_amount" value="{$user.balance + 100}" step="0.01" class="layui-input" placeholder="{:lang('请输入订单金额')}">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{:lang('预计负数约')}</label>
            <div class="layui-input-block">
                <input style="color:red;" type="text" value="" readonly class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{:lang('订单数量')}</label>
            <div class="layui-input-block">
                <input type="number" name="gift3_order_count" value="2" min="1" class="layui-input" placeholder="{:lang('请输入订单数量')}">
            </div>
        </div>
    </fieldset>

    <div class="layui-form-item">
        <div class="layui-input-block">
            <button class="layui-btn" lay-submit lay-filter="formSubmit">{:lang('发送礼包')}</button>
        </div>
    </div>
</form>

<script>
    
    window.form.render();
        
    var userBalance = {$user.balance};

    // 计算礼包2预计负数（余额 - 订单金额）
    function calcNegative2() {
        var val = parseFloat($('input[name="gift2_order_amount"]').val()) || 0;
        var result = userBalance - val;
        $('input[name="gift2_order_amount"]').closest('fieldset').find('input[readonly][style*="color:red"]').val(result.toFixed(2));
    }

    // 计算礼包3预计负数（余额 - 订单金额 × 订单数量）
    function calcNegative3() {
        var amount = parseFloat($('input[name="gift3_order_amount"]').val()) || 0;
        var count = parseInt($('input[name="gift3_order_count"]').val()) || 1;
        var result = userBalance - (amount * count);
        $('input[name="gift3_order_amount"]').closest('fieldset').find('input[readonly][style*="color:red"]').val(result.toFixed(2));
    }

    // 绑定礼包2
    $('input[name="gift2_order_amount"]').on('input change', function() {
        calcNegative2();
    });

    // 绑定礼包3（金额或数量变化都要重新计算）
    $('input[name="gift3_order_amount"], input[name="gift3_order_count"]').on('input change', function() {
        calcNegative3();
    });

    // 页面加载时初始化
    calcNegative2();
    calcNegative3();
</script>
